<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaunchPro</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/css/all.min.css" />
    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white py-3">
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="#home"
          style="color: #071641; font-size: 22px"
        >
          <i class="fa-solid fa-rocket" style="color: #0e3fa0"></i>
          LaunchPro
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link active fw-semibold"
                href="#home"
                style="color: #074cd6"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="#features"
                style="color: #0d235f"
                >Features</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="#about"
                style="color: #142d72"
                >About</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="#pricing"
                style="color: #11265e"
                >Pricing</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="#testimonials"
                style="color: #10245c"
                >Testimonials</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="#contact"
                style="color: #10245c"
                >Contact</a
              >
            </li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <a
              href="#contact"
              class="text-decoration-none"
              style="color: #10245c; font-size: 18px"
            >
              <i class="fa-solid fa-magnifying-glass"></i>
            </a>
            <a
              href="#contact"
              class="d-flex align-items-center justify-content-center rounded-circle text-decoration-none"
              style="
                width: 40px;
                height: 40px;
                background-color: #1464ff;
                color: white;
              "
            >
              <i class="fa-regular fa-user"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>
