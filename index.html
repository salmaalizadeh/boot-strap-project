<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaunchPro</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/css/all.min.css" />
    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white py-3">
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="#home"
          style="color: #071641; font-size: 22px"
        >
          <i class="fa-solid fa-rocket" style="color: #0e3fa0"></i>
          LaunchPro
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link active fw-semibold"
                href="#home"
                style="color: #074cd6"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="#features"
                style="color: #0d235f"
                >Features</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="#about"
                style="color: #142d72"
                >About</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="#pricing"
                style="color: #11265e"
                >Pricing</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="#testimonials"
                style="color: #10245c"
                >Testimonials</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link fw-semibold"
                href="#contact"
                style="color: #10245c"
                >Contact</a
              >
            </li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <a
              href="#contact"
              class="text-decoration-none"
              style="color: #10245c; font-size: 18px"
            >
              <i class="fa-solid fa-magnifying-glass"></i>
            </a>
            <a
              href="#contact"
              class="d-flex align-items-center justify-content-center rounded-circle text-decoration-none"
              style="
                width: 40px;
                height: 40px;
                background-color: #1464ff;
                color: white;
              "
            >
              <i class="fa-regular fa-user"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>
    <section id="home" class="py-5">
      <div class="container">
        <div class="row align-items-center min-vh-75">
          <div class="col-lg-6">
            <h1
              class="fw-bold lh-sm mb-4"
              style="color: #10245c; font-size: 55px"
            >
              Our Creativity Is Your
              <br />
              <span style="color: #1464ff">Success</span>
            </h1>
            <p
              class="text-secondary mb-4"
              style="font-size: 17px; line-height: 1.8; max-width: 480px"
            >
              We help businesses and individuals turn their ideas into powerful
              digital products. Modern design, clean code and amazing experience
              are what we deliver.
            </p>
            <div class="d-flex flex-wrap gap-3">
              <a
                href="#contact"
                class="btn px-4 py-3 text-white fw-semibold"
                style="background-color: #1464ff; border-radius: 8px"
              >
                Get Started
                <i class="fa-solid fa-arrow-right ms-2"></i>
              </a>
              <a
                href="#about"
                class="btn px-4 py-3 fw-semibold d-flex align-items-center gap-2"
                style="
                  color: #10245c;
                  border: 1px solid #1464ff;
                  background-color: white;
                  border-radius: 8px;
                "
              >
                <i
                  class="fa-solid fa-play"
                  style="color: #1464ff; font-size: 12px"
                ></i>
                Watch Video
              </a>
            </div>
          </div>
          <div class="col-lg-6 text-center mt-5 mt-lg-0">
            <img
              src="img/img3.png"
              class="img-fluid"
              alt="LaunchPro Hero"
              style="max-height: 500px"
            />
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
